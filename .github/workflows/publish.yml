# Publish to PyPI using Trusted Publishers (OIDC)
name: Publish to PyPI

# Do NOT add workflow_call here. PyPI Trusted Publishing takes the workflow
# filename from the OIDC claim, and for a reusable workflow that claim names the
# calling workflow, so uploads are rejected with "Invalid attestations ... does
# not match expected Trusted Publisher (publish.yml @ ...)".
# create-release.yml dispatches this workflow instead.
on:
  release:
    types: [published]
  workflow_dispatch:  # dispatched by create-release.yml, or run by hand

jobs:
  publish:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for Trusted Publisher OIDC

    steps:
      # No explicit ref: this builds whatever ref it was dispatched on.
      # create-release.yml dispatches the release TAG, not the branch, so the
      # artifact matches the version that was actually released.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-running a release, or a tag whose artifact is already up, should
          # be a no-op. Without this the upload fails with 400 File already
          # exists and takes the whole release run red.
          skip-existing: true
