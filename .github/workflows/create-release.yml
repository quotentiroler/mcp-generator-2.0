# Create a GitHub release when commits land on a release branch.
# The branch decides the channel: test cuts a beta prerelease, main cuts a
# full release. Both then publish to PyPI via the publish job below.
name: Create Release

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:  # Allow manual triggering

jobs:
  create-release:
    # Always run on push to main or manual trigger.
    # GitHub natively skips workflows when the commit title itself contains [skip ci],
    # so no need to check the message body (which caused false positives on squash merges
    # where sub-commit messages from test bots contained [skip ci]).
    # The pin step pushes a commit back to the release branch; without this the
    # workflow would re-trigger itself for a release it has already cut.
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !startsWith(github.event.head_commit.message || '', 'release: pin version to')
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For creating releases and tags
    outputs:
      released: ${{ steps.create_release.outputs.released }}
      tag: ${{ steps.create_release.outputs.tag }}

    steps:
    - name: Checkout release branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}
        fetch-depth: 0

    - name: Resolve release channel from branch
      id: channel
      run: |
        case "${{ github.ref_name }}" in
          main) CHANNEL=stable; PRERELEASE=false ;;
          test) CHANNEL=beta;   PRERELEASE=true  ;;
          *)    echo "::error::${{ github.ref_name }} is not a release branch"; exit 1 ;;
        esac
        echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
        echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
        echo "${{ github.ref_name }} -> $CHANNEL (prerelease=$PRERELEASE)"

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Get version from pyproject.toml
      id: get_version
      run: |
        VERSION=$(python3 scripts/workflows/read_version.py)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 Version: $VERSION"

    # Pin the version to this branch's channel so the tag, the release, the
    # changelog and the published artifact all agree. Idempotent: on test the
    # version is already -beta, so this is a no-op there.
    - name: Pin version to channel
      id: stable
      env:
        CURRENT_VERSION: ${{ steps.get_version.outputs.version }}
        CHANNEL: ${{ steps.channel.outputs.channel }}
      run: |
        python3 scripts/workflows/update_version_metadata.py --channel "$CHANNEL"

        STABLE=$(python3 scripts/workflows/read_version.py)
        echo "version=$STABLE" >> $GITHUB_OUTPUT
        echo "Channel version: $STABLE"

        STABLE_VERSION="$STABLE" python3 scripts/workflows/retitle_changelog.py

        if git diff --quiet pyproject.toml uv.lock CHANGELOG.md SECURITY.md; then
          echo "Already stable - nothing to commit"
        else
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock CHANGELOG.md SECURITY.md
          git commit -m "release: pin version to $STABLE [automated]"
          git push origin "${{ github.ref_name }}"
          echo "Pinned to $STABLE on ${{ github.ref_name }}"
        fi

    - name: Extract changelog for this version
      id: changelog
      run: |
        python << 'EOF'
        import re
        import sys

        with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
            content = f.read()

        # Find the section for the current version
        # Pattern: ## [version] - date ... next ## or end of file
        version = "${{ steps.stable.outputs.version }}"
        # Strip commit hash if present (e.g., 2.0.0-alpha+abc123 -> 2.0.0-alpha)
        version_base = version.split('+')[0]

        pattern = rf'## \[{re.escape(version_base)}[^\]]*\][^\n]*\n(.*?)(?=\n## \[|$)'
        match = re.search(pattern, content, re.DOTALL)

        if match:
            notes = match.group(1).strip()
            # Write to file to handle multiline content
            with open('release_notes.txt', 'w', encoding='utf-8') as f:
                f.write(notes)
            print(f"✅ Extracted changelog for {version_base}")
        else:
            print(f"⚠️  No changelog found for {version_base}, using default")
            with open('release_notes.txt', 'w', encoding='utf-8') as f:
                f.write(f"Release {version}")
        EOF

    - name: Determine if pre-release
      id: prerelease
      run: |
        echo "prerelease=${{ steps.channel.outputs.prerelease }}" >> $GITHUB_OUTPUT
        echo "${{ github.ref_name }} -> ${{ steps.channel.outputs.channel }} release"

    - name: Create Release
      id: create_release
      uses: actions/github-script@v7
      env:
        VERSION: ${{ steps.stable.outputs.version }}
        IS_PRERELEASE: ${{ steps.prerelease.outputs.prerelease }}
      with:
        script: |
          const fs = require('fs');
          const version = process.env.VERSION;
          const versionBase = version.split('+')[0];
          const tagName = `v${versionBase}`;
          const isPrerelease = process.env.IS_PRERELEASE === 'true';

          // Read release notes
          const releaseNotes = fs.readFileSync('release_notes.txt', 'utf8');

          try {
            // Create the release (this also creates the tag)
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `${tagName}`,
              body: releaseNotes,
              draft: false,
              prerelease: isPrerelease,
              target_commitish: 'main'
            });

            core.setOutput('released', 'true');
            core.setOutput('tag', tagName);
            console.log(`✅ Release created: ${release.data.html_url}`);
            core.summary.addHeading(`Release ${tagName} Created 🎉`);
            core.summary.addLink('View Release', release.data.html_url);
            core.summary.addRaw('\n\n');
            core.summary.addHeading('Release Notes', 3);
            core.summary.addRaw(releaseNotes);
            await core.summary.write();

          } catch (error) {
            if (error.status === 422 && error.message.includes('already_exists')) {
              core.setOutput('released', 'false');
              core.setOutput('tag', tagName);
              console.log(`⚠️  Release ${tagName} already exists — skipping (this is expected if version was not bumped)`);
              core.summary.addHeading(`Release ${tagName} Already Exists ℹ️`);
              core.summary.addRaw('No action needed. Bump version in pyproject.toml to create a new release.');
              await core.summary.write();
              // Don't fail — this is expected behavior when pushing non-release commits
            } else {
              throw error;
            }
          }

    - name: Sync main back to test
      if: always() && github.ref_name == 'main'
      run: |
        echo "🔄 Syncing main into test to prevent branch divergence..."
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git fetch origin test:test
        git checkout test
        # Merge main with automatic resolution — prefer main's content on conflict
        if git merge main --no-edit -m "chore: sync main into test after release [automated]"; then
          echo "✅ Merge succeeded (no conflicts)"
        else
          echo "⚠️  Merge had conflicts — resolving with main's version for metadata files"
          # Auto-resolve known conflict files by taking main's version
          for f in CHANGELOG.md pyproject.toml uv.lock SECURITY.md; do
            if git diff --name-only --diff-filter=U | grep -q "^${f}$"; then
              echo "   Resolving $f with main's version"
              git checkout --theirs "$f"
              git add "$f"
            fi
          done
          # If there are still unresolved conflicts, abort
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "❌ Unresolved conflicts remain — aborting sync"
            git merge --abort
            exit 0  # Don't fail the workflow
          fi
          git commit --no-edit
        fi
        git push origin test
        echo "✅ Test synced with main"

    - name: Summary
      if: always()
      run: |
        echo "=========================================="
        echo "RELEASE CREATION SUMMARY"
        echo "=========================================="
        echo "Version: ${{ steps.stable.outputs.version }}"
        echo "Tag: v${{ steps.stable.outputs.version }}"
        echo "Pre-release: ${{ steps.prerelease.outputs.prerelease }}"
        echo "=========================================="

  publish:
    name: Publish to PyPI
    needs: create-release
    # Only publish when create-release actually cut a NEW release. A push to main
    # that does not bump the version reuses the existing tag and must not republish.
    if: needs.create-release.outputs.released == 'true'
    permissions:
      id-token: write  # Required for Trusted Publisher OIDC
      contents: read
    uses: ./.github/workflows/publish.yml
