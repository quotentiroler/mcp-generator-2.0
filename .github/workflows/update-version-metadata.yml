# Automatically update version metadata in CHANGELOG.md and SECURITY.md
# Runs when commits are pushed to test branch, then commits back to develop
name: Update Version Metadata

on:
  push:
    branches:
      - test
  workflow_dispatch:

# Cancel in-progress runs when a new run is triggered on test
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-metadata:
    # Skip if this commit was made by the bot itself (prevent infinite loop)
    # Skip if commit is a release bump (stable version, no pre-release suffix)
    if: |
      !contains(github.event.head_commit.message, '[automated]') &&
      !startsWith(github.event.head_commit.message, 'release:')
    name: Update Version with Commit Hash
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For committing changes
      actions: write   # For dispatching auto-pr-to-main

    steps:
    - name: Checkout test branch
      uses: actions/checkout@v4
      with:
        ref: test
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Update version metadata
      id: update
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # test is the beta channel; pin the suffix rather than laddering to rc
        python scripts/workflows/update_version_metadata.py --channel beta

        # Check if files were actually changed (including pyproject.toml now)
        if git diff --quiet CHANGELOG.md SECURITY.md pyproject.toml; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "ℹ️  No changes needed"
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "✅ Files updated"
        fi

    - name: Regenerate uv.lock after version bump
      if: steps.update.outputs.changed == 'true'
      run: |
        echo "🔄 Regenerating uv.lock after version bump..."
        uv lock
        echo "✅ uv.lock regenerated"

    - name: Commit changes to test
      if: steps.update.outputs.changed == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Get the latest commit hash from test branch
        COMMIT_HASH=$(git rev-parse --short origin/test)

        git add CHANGELOG.md SECURITY.md pyproject.toml uv.lock
        git commit -m "chore: update version metadata with commit $COMMIT_HASH [automated]"
        git push origin test

    - name: Sync version bump to develop
      if: steps.update.outputs.changed == 'true'
      run: |
        # If version was bumped, push the pyproject.toml change to develop too
        # This prevents develop -> test merges from reverting the version bump
        echo "🔄 Syncing version bump to develop branch..."
        
        git fetch origin develop
        git checkout develop
        git checkout test -- pyproject.toml uv.lock
        
        if ! git diff --quiet pyproject.toml uv.lock; then
          git add pyproject.toml uv.lock
          git commit -m "chore: sync version bump from test [automated]"
          git push origin develop
          echo "✅ Version synced to develop"
        else
          echo "ℹ️  Develop already has the same version"
        fi

    - name: Trigger Auto PR to Main
      uses: actions/github-script@v7
      with:
        script: |
          try {
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'auto-pr-to-main.yml',
              ref: 'test'
            });
            console.log('✅ Dispatched auto-pr-to-main workflow');
          } catch (error) {
            console.log(`⚠️  Could not dispatch auto-pr-to-main: ${error.message}`);
          }

    - name: Summary
      if: always()
      run: |
        echo "=========================================="
        echo "VERSION METADATA UPDATE SUMMARY"
        echo "=========================================="
        if [ "${{ steps.update.outputs.changed }}" == "true" ]; then
          echo "✅ Version metadata updated and committed"
        else
          echo "ℹ️  No changes needed - metadata already up to date"
        fi
        echo "=========================================="
