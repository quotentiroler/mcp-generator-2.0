# Automatically create PR from test to main
# Triggered by other test workflows (update-version-metadata, update-changelog,
# promote-release) via workflow_dispatch AFTER they finish, to avoid race conditions
# where this workflow reads pyproject.toml before the version is bumped.
name: Auto PR to Main

on:
  workflow_dispatch:

# Only one instance at a time — if dispatched twice in quick succession
# (e.g. by version-metadata AND changelog workflows), the latest wins.
concurrency:
  group: auto-pr-to-main
  cancel-in-progress: true

jobs:
  create-pr:
    name: Create PR from test to main
    runs-on: ubuntu-latest
    permissions:
      contents: write  # pushes the release/vX.Y.Z branch
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: test
        fetch-depth: 0

    - name: Fetch main branch
      run: |
        git fetch origin main:main

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    # main is protected and accepts changes only through a PR, so the promotion
    # to stable happens here, on a release branch, rather than being pushed to
    # main by the release job.
    - name: Build release branch with the stable version
      id: release_branch
      run: |
        CURRENT=$(python3 scripts/workflows/read_version.py)
        python3 scripts/workflows/update_version_metadata.py --channel stable
        STABLE=$(python3 scripts/workflows/read_version.py)
        uv lock
        CURRENT_VERSION="$CURRENT" STABLE_VERSION="$STABLE"           python3 scripts/workflows/retitle_changelog.py

        BRANCH="release/v$STABLE"
        echo "branch=$BRANCH" >> $GITHUB_OUTPUT
        echo "stable=$STABLE" >> $GITHUB_OUTPUT

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -B "$BRANCH"

        if git diff --quiet pyproject.toml uv.lock CHANGELOG.md SECURITY.md; then
          echo "Already stable at $STABLE"
        else
          git add pyproject.toml uv.lock CHANGELOG.md SECURITY.md
          git commit -m "release: promote to stable $STABLE [automated]"
        fi
        git push --force origin "$BRANCH"
        echo "$BRANCH ready at $STABLE"

    - name: Check for existing PR
      id: check_pr
      uses: actions/github-script@v7
      env:
        RELEASE_BRANCH: ${{ steps.release_branch.outputs.branch }}
      with:
        script: |
          // Check if there's already an open PR from test to main
          const { data: pulls } = await github.rest.pulls.list({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            head: `${context.repo.owner}:${process.env.RELEASE_BRANCH}`,
            base: 'main'
          });

          if (pulls.length > 0) {
            console.log(`✅ PR already exists: #${pulls[0].number}`);
            console.log(`   Title: ${pulls[0].title}`);
            console.log(`   URL: ${pulls[0].html_url}`);
            core.setOutput('pr_exists', 'true');
            core.setOutput('pr_number', pulls[0].number);
            core.setOutput('pr_url', pulls[0].html_url);
          } else {
            console.log('❌ No existing PR found - will create new one');
            core.setOutput('pr_exists', 'false');
          }

    - name: Get version from pyproject.toml
      id: get_version
      run: |
        VERSION=$(python3 scripts/workflows/read_version.py)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 Version: $VERSION"

    - name: Get commit info
      id: commit_info
      run: |
        # Count commits ahead of main
        COMMIT_COUNT=$(git rev-list --count main..test)
        echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT

    - name: Extract changelog for current version
      id: changelog
      run: |
        python << 'EOF'
        import re

        with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
            content = f.read()

        version = "${{ steps.get_version.outputs.version }}"
        version_base = version.split('+')[0]  # Strip commit hash

        # Find the section for the current version
        pattern = rf'## \[{re.escape(version_base)}[^\]]*\][^\n]*\n(.*?)(?=\n## \[|$)'
        match = re.search(pattern, content, re.DOTALL)

        if match:
            notes = match.group(1).strip()
            # Limit to first 2000 chars to avoid GitHub API limits
            if len(notes) > 2000:
                notes = notes[:2000] + "\n\n... (truncated)"
            with open('pr_changelog.txt', 'w', encoding='utf-8') as f:
                f.write(notes)
            print(f"✅ Extracted changelog for {version_base}")
        else:
            with open('pr_changelog.txt', 'w', encoding='utf-8') as f:
                f.write(f"Release version {version_base}")
            print(f"⚠️  No changelog found for {version_base}")
        EOF

    - name: Update existing PR
      if: steps.check_pr.outputs.pr_exists == 'true'
      uses: actions/github-script@v7
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
        COMMIT_COUNT: ${{ steps.commit_info.outputs.commit_count }}
        PR_NUMBER: ${{ steps.check_pr.outputs.pr_number }}
      with:
        script: |
          const fs = require('fs');
          const version = process.env.VERSION;
          const versionBase = version.split('+')[0];
          const commitCount = Number(process.env.COMMIT_COUNT);
          const prNumber = Number(process.env.PR_NUMBER);

          // Read changelog
          const changelog = fs.readFileSync('pr_changelog.txt', 'utf8');

          const title = `Release: ${versionBase} (${commitCount} commit${commitCount > 1 ? 's' : ''})`;

          const body = `## 🚀 Release ${versionBase}

          This PR was automatically created to release version **${versionBase}** from \`test\` into \`main\`.

          ### 📋 Changelog

          ${changelog}

          ### 📊 Changes
          - **${commitCount}** commit${commitCount > 1 ? 's' : ''} ahead of main

          ### ✅ Pre-Merge Checklist
          - [ ] All CI tests passing
          - [ ] CHANGELOG.md is up to date
          - [ ] Version number is correct in pyproject.toml
          - [ ] Documentation is updated
          - [ ] Breaking changes are documented (if any)

          ### 📦 Post-Merge Actions
          After merging, this will automatically:
          - Create a GitHub release with tag \`v${versionBase}\`
          - Update version metadata in develop branch
          - Trigger any release notifications

          ---
          *This PR was automatically created by the Auto PR to Main workflow*`;

          await github.rest.pulls.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber,
            title: title,
            body: body,
          });

          console.log(`✅ Updated PR #${prNumber} — title: ${title}`);

    - name: Create Pull Request
      if: steps.check_pr.outputs.pr_exists == 'false'
      id: create_pr
      uses: actions/github-script@v7
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
        COMMIT_COUNT: ${{ steps.commit_info.outputs.commit_count }}
        RELEASE_BRANCH: ${{ steps.release_branch.outputs.branch }}
      with:
        script: |
          const fs = require('fs');
          const version = process.env.VERSION;
          const versionBase = version.split('+')[0];
          const commitCount = Number(process.env.COMMIT_COUNT);

          // Read changelog
          const changelog = fs.readFileSync('pr_changelog.txt', 'utf8');

          // Create PR title
          const title = `Release: ${versionBase} (${commitCount} commit${commitCount > 1 ? 's' : ''})`;

          // Create PR body
          const body = `## 🚀 Release ${versionBase}

          This PR was automatically created to release version **${versionBase}** from \`test\` into \`main\`.

          ### 📋 Changelog

          ${changelog}

          ### 📊 Changes
          - **${commitCount}** commit${commitCount > 1 ? 's' : ''} ahead of main

          ### ✅ Pre-Merge Checklist
          - [ ] All CI tests passing
          - [ ] CHANGELOG.md is up to date
          - [ ] Version number is correct in pyproject.toml
          - [ ] Documentation is updated
          - [ ] Breaking changes are documented (if any)

          ### 📦 Post-Merge Actions
          After merging, this will automatically:
          - Create a GitHub release with tag \`v${versionBase}\`
          - Update version metadata in develop branch
          - Trigger any release notifications

          ---
          *This PR was automatically created by the Auto PR to Main workflow*`;

          // Create the PR
          const { data: pr } = await github.rest.pulls.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            head: process.env.RELEASE_BRANCH,
            base: 'main'
          });

          console.log(`✅ Created PR #${pr.number}`);
          console.log(`   URL: ${pr.html_url}`);

          core.setOutput('pr_number', pr.number);
          core.setOutput('pr_url', pr.html_url);

          return pr.number;

    - name: Add labels to PR
      if: steps.check_pr.outputs.pr_exists == 'false' && steps.create_pr.outputs.pr_number
      uses: actions/github-script@v7
      env:
        PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
      with:
        script: |
          try {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              labels: ['automated', 'release']
            });
            console.log('✅ Added labels to PR');
          } catch (error) {
            // Labels might not exist, just log and continue
            console.log('⚠️  Could not add labels (they may not exist)');
          }

    - name: Summary
      if: always()
      run: |
        echo "=========================================="
        echo "AUTO PR TO MAIN WORKFLOW SUMMARY"
        echo "=========================================="
        echo "Version: ${{ steps.get_version.outputs.version }}"
        echo "Commits ahead: ${{ steps.commit_info.outputs.commit_count }}"
        if [ "${{ steps.check_pr.outputs.pr_exists }}" == "true" ]; then
          echo "✅ Updated existing PR: #${{ steps.check_pr.outputs.pr_number }}"
          echo "   URL: ${{ steps.check_pr.outputs.pr_url }}"
        elif [ -n "${{ steps.create_pr.outputs.pr_number }}" ]; then
          echo "✅ Created new PR: #${{ steps.create_pr.outputs.pr_number }}"
          echo "   URL: ${{ steps.create_pr.outputs.pr_url }}"
        else
          echo "❌ Failed to create or update PR"
        fi
        echo "=========================================="
