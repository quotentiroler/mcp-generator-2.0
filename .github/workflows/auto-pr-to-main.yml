# test ──> main. Logic lives in promote-pr.yml; this only names the hop.
#
# This used to cut a release/vX.Y.Z branch from test and add a commit stripping
# the -beta suffix, because the version lived in pyproject.toml and main had to
# carry a different string. hatch-vcs derives the version from the release tag
# now, so there is nothing to promote but the commits themselves.
name: Auto PR to Main

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  promote:
    uses: ./.github/workflows/promote-pr.yml
    with:
      head-branch: test
      base-branch: main
      body: >-
        Standing promotion PR, kept up to date by `promote-pr.yml`.
        Merging promotes `test` into `main`, which cuts and publishes a stable release.
