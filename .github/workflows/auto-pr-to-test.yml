# develop ──> test. Logic lives in promote-pr.yml; this only names the hop.
name: Auto PR to Test

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  promote:
    uses: ./.github/workflows/promote-pr.yml
    with:
      head-branch: develop
      base-branch: test
      body: >-
        Standing promotion PR, kept up to date by `promote-pr.yml`.
        Merging promotes `develop` into `test`, which cuts and publishes a beta.
